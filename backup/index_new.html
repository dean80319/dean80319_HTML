<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鷗哩手作</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sw: 260px;
            --gold: #c9a227;
            --gold-lt: #e8d07a;
            --border: rgba(255,255,255,0.08);
            --text: rgba(255,255,255,0.92);
            --dim: rgba(255,255,255,0.45);
            --card: rgba(255,255,255,0.07);
            --t: 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", "PingFang TC", sans-serif;
            color: var(--text);
            background: #080c1e;
        }

        /* ── Deep-space background ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: -2;
            background:
                radial-gradient(ellipse 70% 60% at 15% 15%, rgba(90,30,180,0.18) 0%, transparent 65%),
                radial-gradient(ellipse 55% 70% at 85% 75%, rgba(20,55,140,0.22) 0%, transparent 65%),
                linear-gradient(150deg, #07091a 0%, #0d1230 45%, #110820 100%);
        }

        /* ── Star field (with twinkling) ── */
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: -1;
            background-image:
                radial-gradient(1.2px 1.2px at 12% 22%, rgba(255,255,255,0.45) 0%, transparent 100%),
                radial-gradient(1px   1px   at 33% 68%, rgba(255,255,255,0.30) 0%, transparent 100%),
                radial-gradient(1px   1px   at 58% 30%, rgba(255,255,255,0.38) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 78% 78%, rgba(255,255,255,0.28) 0%, transparent 100%),
                radial-gradient(1px   1px   at 91% 12%, rgba(255,255,255,0.42) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 45% 88%, rgba(255,255,255,0.22) 0%, transparent 100%),
                radial-gradient(2px   2px   at  8% 83%, rgba(201,162,39,0.28)  0%, transparent 100%),
                radial-gradient(2px   2px   at 70% 93%, rgba(201,162,39,0.18)  0%, transparent 100%),
                radial-gradient(1px   1px   at 25% 45%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px   1px   at 67% 15%, rgba(255,255,255,0.40) 0%, transparent 100%),
                radial-gradient(1.2px 1.2px at 82% 38%, rgba(255,255,255,0.30) 0%, transparent 100%),
                radial-gradient(1px   1px   at 48% 72%, rgba(255,255,255,0.25) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 15% 57%, rgba(255,255,255,0.20) 0%, transparent 100%),
                radial-gradient(1px   1px   at 93% 55%, rgba(255,255,255,0.32) 0%, transparent 100%),
                radial-gradient(2px   2px   at 37%  5%, rgba(201,162,39,0.22)  0%, transparent 100%),
                radial-gradient(1px   1px   at 55% 50%, rgba(255,255,255,0.18) 0%, transparent 100%),
                radial-gradient(1.3px 1.3px at  3% 40%, rgba(255,255,255,0.28) 0%, transparent 100%);
            animation: starTwinkle 8s ease-in-out infinite alternate;
        }

        @keyframes starTwinkle {
            0%   { opacity: 0.6; }
            100% { opacity: 1.0; }
        }

        /* ═══════════════════════════════════════════
           LAYOUT
        ═══════════════════════════════════════════ */
        .layout { display: flex; height: 100vh; overflow: hidden; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sw);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(7,9,26,0.96);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 300;
            transition: margin-left var(--t);
        }

        .sidebar.collapsed { margin-left: calc(-1 * var(--sw)); }

        .sb-logo {
            padding: 1.8rem 1.5rem 1.4rem;
            border-bottom: 1px solid var(--border);
            text-align: center;
            flex-shrink: 0;
        }

        .sb-brand {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #b8891a 0%, var(--gold-lt) 50%, #b8891a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sb-tagline {
            font-size: 0.68rem;
            letter-spacing: 3.5px;
            color: var(--dim);
            margin-top: 5px;
            text-transform: uppercase;
        }

        .sb-nav {
            flex: 1;
            padding: 0.9rem 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 12px;
            background: none;
            border: 1px solid transparent;
            border-radius: 10px;
            color: var(--dim);
            font-size: 0.88rem;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--t);
            text-align: left;
        }

        .nav-btn .ico { font-size: 1.05rem; flex-shrink: 0; }
        .nav-btn .lbl { flex: 1; }
        .nav-btn .arr { font-size: 0.65rem; transition: transform var(--t); }
        .nav-btn .arr.open { transform: rotate(90deg); }

        .nav-btn:hover {
            background: rgba(201,162,39,0.07);
            border-color: rgba(201,162,39,0.18);
            color: var(--text);
        }

        .nav-btn:hover .ico { filter: drop-shadow(0 0 7px rgba(201,162,39,0.55)); }

        .nav-btn.active {
            background: rgba(201,162,39,0.12);
            border-color: rgba(201,162,39,0.30);
            color: var(--gold-lt);
        }

        .nav-btn.active .ico { filter: drop-shadow(0 0 8px rgba(201,162,39,0.65)); }

        .nav-btn:focus-visible,
        .toggle-btn:focus-visible,
        .btn:focus-visible,
        .sub-link:focus-visible {
            outline: 2px solid rgba(201,162,39,0.65);
            outline-offset: 2px;
        }

        .submenu {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease;
            padding-left: 8px;
        }

        .submenu.open { max-height: 200px; }

        .sub-link {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 12px;
            color: var(--dim);
            font-size: 0.82rem;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--t);
            background: none;
            border: none;
            width: 100%;
            font-family: inherit;
            text-align: left;
        }

        .sub-link:hover { background: rgba(255,255,255,0.05); color: var(--text); }

        .nav-sep { height: 1px; background: var(--border); margin: 5px 3px; }

        .sb-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.68rem;
            color: var(--dim);
            text-align: center;
            flex-shrink: 0;
        }

        /* ── MAIN ── */
        .main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-width: 0;
        }

        .sb-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 299;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--t);
        }

        .sb-backdrop.visible {
            opacity: 1;
            pointer-events: all;
        }

        .toggle-btn {
            position: absolute;
            top: 1.2rem;
            left: 1.2rem;
            z-index: 200;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.055);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--t);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toggle-btn:hover {
            background: rgba(201,162,39,0.10);
            border-color: rgba(201,162,39,0.30);
            color: var(--gold-lt);
        }

        /* ═══════════════════════════════════════════
           PAGES
        ═══════════════════════════════════════════ */
        .page {
            display: none;
            width: 100%;
            max-width: 600px;
            max-height: calc(100vh - 3.5rem);
            overflow-y: auto;
            padding: 0 1rem;
            animation: fadeUp 0.38s ease;
        }

        .page.active { display: block; }

        .page::-webkit-scrollbar { width: 3px; }
        .page::-webkit-scrollbar-track { background: transparent; }
        .page::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 1px solid rgba(201,162,39,0.30);
            border-radius: 22px;
            padding: 2.4rem 2.2rem;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.025),
                0 22px 64px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* ═══════════════════════════════════════════
           WELCOME PAGE
        ═══════════════════════════════════════════ */
        .welcome-icon {
            font-size: 3.6rem;
            display: block;
            text-align: center;
            margin-bottom: 1.2rem;
            animation: floatY 4s ease-in-out infinite;
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0);    }
            50%       { transform: translateY(-9px); }
        }

        .welcome-title {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            background: linear-gradient(130deg, #fff 10%, var(--gold-lt) 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-body {
            text-align: center;
            color: var(--dim);
            font-size: 0.92rem;
            line-height: 1.9;
        }

        .tag-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 1.6rem;
        }

        .tag {
            padding: 5px 13px;
            border-radius: 20px;
            background: rgba(201,162,39,0.09);
            border: 1px solid rgba(201,162,39,0.22);
            font-size: 0.78rem;
            color: var(--gold-lt);
            letter-spacing: 0.5px;
        }

        /* ═══════════════════════════════════════════
           BRACELET DESIGNER
        ═══════════════════════════════════════════ */
        .sec-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.9rem;
        }

        .ctrl-lbl {
            font-size: 0.82rem;
            color: var(--dim);
            white-space: nowrap;
            width: 62px;
        }

        .ctrl-val { color: var(--gold-lt); font-weight: 600; font-size: 0.85rem; }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px; height: 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-lt));
            cursor: pointer;
            box-shadow: 0 0 8px rgba(201,162,39,0.5);
        }

        select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #141b2e;
            color: var(--text);
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        select:focus { border-color: rgba(201,162,39,0.35); }

        select option {
            background: #141b2e;
            color: rgba(255,255,255,0.9);
        }

        .crystal-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 1rem 0 0.4rem;
        }

        .c-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: transform var(--t);
            border-radius: 8px;
        }

        .c-opt:hover { transform: translateY(-5px); }

        .c-sphere {
            width: 42px; height: 42px;
            border-radius: 50%;
            position: relative;
            box-shadow:
                0 4px 14px rgba(0,0,0,0.45),
                inset 0 -3px 7px rgba(0,0,0,0.35),
                inset 0 3px 5px rgba(255,255,255,0.28);
            transition: box-shadow var(--t);
        }

        .c-opt:hover .c-sphere {
            box-shadow:
                0 6px 20px rgba(0,0,0,0.5),
                0 0 14px var(--glow, rgba(201,162,39,0.3)),
                inset 0 -3px 7px rgba(0,0,0,0.35),
                inset 0 3px 5px rgba(255,255,255,0.28);
        }

        .c-sphere::after {
            content: '';
            position: absolute;
            top: 17%; left: 17%;
            width: 28%; height: 18%;
            background: rgba(255,255,255,0.58);
            border-radius: 50%;
            transform: rotate(-28deg);
        }

        .c-name { font-size: 0.7rem; color: var(--dim); }

        .sph-amethyst   { background: radial-gradient(circle at 35% 30%, #c4b5fd, #7c3aed 50%, #4c1d95); --glow: rgba(124,58,237,0.4); }
        .sph-citrine    { background: radial-gradient(circle at 35% 30%, #fef3c7, #f59e0b 50%, #92400e); --glow: rgba(245,158,11,0.4); }
        .sph-aquamarine { background: radial-gradient(circle at 35% 30%, #a5f3fc, #06b6d4 50%, #164e63); --glow: rgba(6,182,212,0.4);  }
        .sph-tourmaline { background: radial-gradient(circle at 35% 30%, #fda4af, #f43f5e 35%, #6d28d9); --glow: rgba(244,63,94,0.3);  }
        .sph-garnet     { background: radial-gradient(circle at 35% 30%, #fca5a5, #dc2626 50%, #7f1d1d); --glow: rgba(220,38,38,0.4);  }

        .svg-wrap {
            background: rgba(0,0,0,0.28);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin: 0.8rem 0;
            display: flex;
            justify-content: center;
        }

        #bracelet-svg { width: 100%; max-width: 250px; height: auto; }

        .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .btn {
            padding: 9px 20px;
            border-radius: 10px;
            font-size: 0.83rem;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--t);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .btn-gold {
            background: rgba(201,162,39,0.10);
            border-color: rgba(201,162,39,0.28);
            color: var(--gold-lt);
        }

        .btn-gold:hover {
            background: rgba(201,162,39,0.18);
            border-color: var(--gold);
            box-shadow: 0 0 14px rgba(201,162,39,0.15);
        }

        .btn-red {
            background: rgba(220,38,38,0.09);
            border-color: rgba(220,38,38,0.22);
            color: #fca5a5;
        }

        .btn-red:hover {
            background: rgba(220,38,38,0.18);
            border-color: rgba(220,38,38,0.50);
        }

        .hint {
            text-align: center;
            font-size: 0.72rem;
            color: var(--dim);
            margin-top: 7px;
        }

        /* ═══════════════════════════════════════════
           DIVINATION RESULT PAGE
        ═══════════════════════════════════════════ */
        .div-icon {
            font-size: 4rem;
            display: block;
            text-align: center;
            margin-bottom: 1rem;
            animation: pulseGem 3s ease-in-out infinite;
        }

        @keyframes pulseGem {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(201,162,39,0.3));  transform: scale(1);    }
            50%       { filter: drop-shadow(0 0 22px rgba(201,162,39,0.7)); transform: scale(1.08); }
        }

        .div-title {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 1.4rem;
            background: linear-gradient(130deg, var(--gold-lt) 0%, #fff 50%, var(--gold-lt) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .div-box {
            border: 1px dashed rgba(201,162,39,0.30);
            border-radius: 14px;
            padding: 1.5rem 1.8rem;
            background: rgba(201,162,39,0.035);
            animation: fadeUp 1s ease;
        }

        .div-line {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 0;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.055);
        }

        .div-line:last-child  { border-bottom: none; padding-bottom: 0; }
        .div-line:first-child { padding-top: 0; }

        .div-line::before {
            content: '✦';
            color: var(--gold);
            font-size: 0.65rem;
            flex-shrink: 0;
        }

        /* ═══════════════════════════════════════════
           DIVINATION ANIMATION OVERLAY
        ═══════════════════════════════════════════ */
        #div-overlay {
            position: fixed; inset: 0;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse 80% 70% at 50% 40%, #10082e 0%, #030412 70%, #000 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.55s ease;
        }

        #div-overlay.show { opacity: 1; pointer-events: all; }

        #anim-canvas {
            position: absolute; inset: 0;
            pointer-events: none;
        }

        #cb-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            transform: scale(0.08);
            opacity: 0;
            transition:
                transform 0.72s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity   0.4s  ease;
        }

        #cb-scene.appear { transform: scale(1); opacity: 1; }

        .cb-ball {
            width: 220px; height: 220px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 120%, rgba(255,255,255,0.09), rgba(10,5,30,0.7) 65%);
            border: 1px solid rgba(200,180,255,0.18);
            box-shadow:
                0 0 60px rgba(100,60,220,0.22),
                0 0 120px rgba(80,40,200,0.10),
                inset 0 0 35px rgba(255,255,255,0.06),
                inset 0 -25px 55px rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
        }

        .cb-aurora1 {
            position: absolute; inset: -18%;
            background: conic-gradient(from 0deg at 50% 55%,
                transparent 0deg,
                rgba(110, 55, 230, 0.65) 55deg,
                rgba(150, 80, 255, 0.40) 90deg,
                transparent 140deg,
                rgba( 50,120, 220, 0.45) 210deg,
                transparent 270deg,
                rgba(170, 70, 255, 0.55) 330deg,
                transparent 360deg
            );
            filter: blur(18px);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.9s ease;
        }

        .cb-aurora1.on {
            opacity: 1;
            animation: auroraCW 7.5s linear infinite;
        }

        @keyframes auroraCW {
            from { transform: rotate(0deg)   scale(1.0); }
            to   { transform: rotate(360deg) scale(1.08); }
        }

        .cb-aurora2 {
            position: absolute; inset: -18%;
            background: conic-gradient(from 80deg at 45% 45%,
                transparent 0deg,
                rgba( 40, 200, 200, 0.45) 50deg,
                transparent 110deg,
                rgba(210, 160,  35, 0.55) 190deg,
                rgba(255, 200,  60, 0.30) 230deg,
                transparent 280deg,
                rgba( 60, 170, 255, 0.35) 330deg,
                transparent 360deg
            );
            filter: blur(15px);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.9s ease;
        }

        .cb-aurora2.on {
            opacity: 1;
            animation: auroraCCW 5.2s linear infinite;
        }

        @keyframes auroraCCW {
            from { transform: rotate(0deg)    scale(0.92); }
            to   { transform: rotate(-360deg) scale(1.0);  }
        }

        .cb-iglow {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: transparent;
            transition: background 2s ease, filter 2s ease;
            filter: blur(4px);
        }

        .cb-iglow.bright {
            background: radial-gradient(circle at 50% 62%,
                rgba(255,255,255,1.0)  0%,
                rgba(255,230, 90,0.85) 25%,
                rgba(201,162, 39,0.50) 55%,
                transparent 80%
            );
        }

        .cb-reflex {
            position: absolute;
            top: 8%; left: 14%;
            width: 48px; height: 24px;
            border-radius: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.65), transparent);
            transform: rotate(-30deg);
            pointer-events: none;
        }

        .cb-base {
            width: 135px; height: 42px;
            background: linear-gradient(to right, #3730a3, #1e1b4b 50%, #3730a3);
            border-radius: 8px 8px 16px 16px;
            border: 1px solid rgba(180,160,255,0.12);
            box-shadow:
                0 14px 28px rgba(0,0,0,0.65),
                0  0  40px rgba(80,60,200,0.18),
                inset 0 2px 5px rgba(255,255,255,0.16);
            margin-top: -12px;
            position: relative;
            z-index: -1;
        }

        .oracle-text {
            margin-top: 22px;
            font-size: 0.82rem;
            letter-spacing: 5px;
            color: rgba(201,162,39,0);
            transition: color 1.1s ease;
            text-align: center;
            font-weight: 300;
        }

        .oracle-text.visible { color: rgba(201,162,39,0.75); }

        #screen-flash {
            position: fixed; inset: 0;
            z-index: 10001;
            background: radial-gradient(circle, #fffdf0 0%, #fff 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }

        #screen-flash.flash { opacity: 1; transition: opacity 0.14s ease-out; }

        /* ═══════════════════════════════════════════
           TAROT DAILY DRAW
        ═══════════════════════════════════════════ */
        .tarot-btn {
            display: inline-block;
            margin-top: 1.8rem;
            padding: 11px 30px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(90,50,180,0.18), rgba(201,162,39,0.12));
            border: 1px solid rgba(201,162,39,0.32);
            color: var(--gold-lt);
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 3.5px;
            transition: all var(--t);
        }

        .tarot-btn:hover {
            background: linear-gradient(135deg, rgba(90,50,180,0.28), rgba(201,162,39,0.22));
            border-color: var(--gold);
            box-shadow: 0 0 22px rgba(201,162,39,0.18), 0 0 44px rgba(90,50,180,0.12);
        }

        .tarot-reveal {
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1.8rem;
        }

        .flip-scene {
            width: 178px;
            height: 288px;
            perspective: 900px;
            flex-shrink: 0;
        }

        .flip-card {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.4,0,0.2,1);
        }

        .flip-card.flipped { transform: rotateY(180deg); }

        .flip-face {
            position: absolute; inset: 0;
            border-radius: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
            border: 1px solid rgba(201,162,39,0.28);
            box-shadow: 0 10px 36px rgba(0,0,0,0.55);
        }

        .flip-back {
            background: radial-gradient(ellipse at 50% 38%, #1c1040, #06051a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .flip-back::before {
            content: '';
            position: absolute; inset: 9px;
            border: 1px solid rgba(201,162,39,0.18);
            border-radius: 8px;
        }

        .back-sym  { font-size: 2.4rem; opacity: 0.55; }
        .back-name { font-size: 0.62rem; letter-spacing: 4px; color: rgba(201,162,39,0.45); }

        .flip-front {
            transform: rotateY(180deg);
            background: #050415;
            display: flex;
            flex-direction: column;
        }

        .card-num {
            text-align: center;
            font-size: 0.62rem;
            letter-spacing: 3px;
            color: rgba(201,162,39,0.55);
            padding: 7px 0 3px;
            flex-shrink: 0;
        }

        .card-art-wrap { flex: 1; overflow: hidden; }
        .card-art-wrap svg { width: 100%; height: 100%; display: block; }

        .card-name-plate {
            background: rgba(0,0,0,0.55);
            border-top: 1px solid rgba(201,162,39,0.22);
            padding: 7px;
            text-align: center;
            flex-shrink: 0;
        }

        .card-name-zh { font-size: 0.85rem; font-weight: 600; color: var(--gold-lt); letter-spacing: 2px; }
        .card-name-en { font-size: 0.56rem; color: var(--dim); letter-spacing: 1px; margin-top: 2px; }

        .fortune-text {
            background: rgba(201,162,39,0.04);
            border: 1px solid rgba(201,162,39,0.18);
            border-radius: 12px;
            padding: 1.1rem 1.3rem;
            font-size: 0.86rem;
            line-height: 1.9;

            opacity: 0;

        }

        .fortune-text.show { opacity: 1; transform: translateY(0); }

        /* ═══════════════════════════════════════════
           RESPONSIVE — MOBILE

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;

<script>
    // ─── Page switching ───
    function showPage(id, navBtn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const el = document.getElementById('page-' + id);
        if (el) el.classList.add('active');
        if (id === 'designer') updateBracelet();

        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if (navBtn) navBtn.classList.add('active');

        if (window.innerWidth <= 768) closeSidebar();
    }

    // ─── Sidebar ───
    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        if (sb.classList.contains('collapsed')) {
            openSidebar();
        } else {
            closeSidebar();
        }
    }

    function openSidebar() {
        const sb       = document.getElementById('sidebar');
        const btn      = document.getElementById('toggle-btn');
        const backdrop = document.getElementById('sb-backdrop');
        sb.classList.remove('collapsed');
        btn.textContent = '✕';
        btn.setAttribute('aria-label', '關閉選單');
        backdrop.classList.add('visible');
    }

    function closeSidebar() {
        const sb       = document.getElementById('sidebar');
        const btn      = document.getElementById('toggle-btn');
        const backdrop = document.getElementById('sb-backdrop');
        sb.classList.add('collapsed');
        btn.textContent = '☰';
        btn.setAttribute('aria-label', '開啟選單');
        backdrop.classList.remove('visible');
    }

    function toggleSub(id, btn) {
        const sub    = document.getElementById(id);
        const arrow  = btn.querySelector('.arr');
        const isOpen = sub.classList.contains('open');
        sub.classList.toggle('open');
        arrow.classList.toggle('open');
        btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
    }

    if (window.innerWidth <= 768) closeSidebar();

    // ─── Bracelet Designer ───
    let selectedBeads    = [];
    let draggedBeadIndex = null;

    const sizeInput     = document.getElementById('bracelet-size');
    const sizeValSpan   = document.getElementById('size-val');
    const beadSizeInput = document.getElementById('bead-size');
    const beadsGroup    = document.getElementById('beads-group');
    const baseCircle    = document.getElementById('base-circle');
    const braceletSvg   = document.getElementById('bracelet-svg');
    const svgHint       = document.getElementById('svg-hint');

    sizeInput.addEventListener('input', () => {
        sizeValSpan.textContent = sizeInput.value;
        updateBracelet();
    });

    function getNextBeadAngle() {
        if (selectedBeads.length === 0) return 0;
        if (selectedBeads.length === 1) return (selectedBeads[0].angle + Math.PI) % (2 * Math.PI);

        const angles = selectedBeads.map(b => {
            let a = b.angle % (2 * Math.PI);
            return a < 0 ? a + 2 * Math.PI : a;
        }).sort((a, b) => a - b);

        let maxGap = 0, insertAngle = 0;
        for (let i = 0; i < angles.length; i++) {
            const cur = angles[i];
            const nxt = angles[(i + 1) % angles.length];
            const gap = nxt > cur ? nxt - cur : nxt + 2 * Math.PI - cur;
            if (gap > maxGap) { maxGap = gap; insertAngle = (cur + gap / 2) % (2 * Math.PI); }
        }
        return insertAngle;
    }

    function addBead(type) {
        if (selectedBeads.length >= 24) return;
        const size = parseFloat(beadSizeInput.value) || 6;
        selectedBeads.push({ type, size, angle: getNextBeadAngle() });
        updateBracelet();
    }

    function distributeEvenly() {
        const n = selectedBeads.length;
        selectedBeads.forEach((b, i) => { b.angle = (i / n) * 2 * Math.PI; });
        updateBracelet();
    }

    function clearBeads() {
        selectedBeads = [];
        updateBracelet();
    }

    const NS = "http://www.w3.org/2000/svg";

    function updateBracelet() {
        const sizeCm = parseFloat(sizeInput.value);
        const radius = (sizeCm / 14) * 70;
        baseCircle.setAttribute('r', radius);
        beadsGroup.innerHTML = '';

        svgHint.style.display = selectedBeads.length === 0 ? '' : 'none';

        selectedBeads.forEach((bead, index) => {
            const r = bead.size * (8 / 6);
            const x = 150 + radius * Math.cos(bead.angle);
            const y = 150 + radius * Math.sin(bead.angle);
            const isDragging = draggedBeadIndex === index;

            const circle = document.createElementNS(NS, "circle");
            circle.setAttribute("cx", x);
            circle.setAttribute("cy", y);
            circle.setAttribute("r", r);
            circle.setAttribute("fill", `url(#g-${bead.type})`);
            circle.setAttribute("stroke", isDragging ? "#e8d07a" : "rgba(255,255,255,0.2)");
            circle.setAttribute("stroke-width", isDragging ? "2" : "1");
            circle.setAttribute("filter", "url(#bead-shadow)");
            circle.style.cursor = isDragging ? "grabbing" : "grab";

            circle.addEventListener('mousedown', e => {
                draggedBeadIndex = index;
                circle.style.cursor = "grabbing";
                e.stopPropagation();
            });

            circle.addEventListener('touchstart', e => {
                draggedBeadIndex = index;
                e.stopPropagation();
            }, { passive: true });

            beadsGroup.appendChild(circle);

            const shine = document.createElementNS(NS, "ellipse");
            const ox = Math.cos(bead.angle - 0.6) * r * 0.28;
            const oy = Math.sin(bead.angle - 0.6) * r * 0.28;
            shine.setAttribute("cx", x + ox - r * 0.12);
            shine.setAttribute("cy", y + oy - r * 0.12);
            shine.setAttribute("rx", r * 0.24);
            shine.setAttribute("ry", r * 0.14);
            shine.setAttribute("fill", "rgba(255,255,255,0.5)");
            shine.setAttribute("transform", `rotate(-28,${x},${y})`);
            shine.style.pointerEvents = "none";
            beadsGroup.appendChild(shine);
        });
    }

    braceletSvg.addEventListener('mousemove', e => {
        if (draggedBeadIndex === null) return;
        const rect = braceletSvg.getBoundingClientRect();
        const svgX = (e.clientX - rect.left) * (300 / rect.width);
        const svgY = (e.clientY - rect.top)  * (300 / rect.height);
        let angle = Math.atan2(svgY - 150, svgX - 150);
        if (angle < 0) angle += 2 * Math.PI;
        selectedBeads[draggedBeadIndex].angle = angle;
        updateBracelet();
    });

    window.addEventListener('mouseup', () => {
        if (draggedBeadIndex !== null) { draggedBeadIndex = null; updateBracelet(); }
    });

    braceletSvg.addEventListener('touchmove', e => {
        if (draggedBeadIndex === null) return;
        const touch = e.touches[0];
        const rect  = braceletSvg.getBoundingClientRect();
        const svgX  = (touch.clientX - rect.left) * (300 / rect.width);
        const svgY  = (touch.clientY - rect.top)  * (300 / rect.height);
        let angle   = Math.atan2(svgY - 150, svgX - 150);
        if (angle < 0) angle += 2 * Math.PI;

    function _r(n) {
        n = Math.abs(n) | 0;

        n = (n + (n << 3)) & 0x7fffffff;
        n = n ^ (n >>> 4);
        n = (n * 0x27d4eb2d) & 0x7fffffff;
        n = n ^ (n >>> 15);
        return n / 0x7fffffff;
    }

            const r = (0.3 + _r(uid * 997 + i + 250) * 1.3).toFixed(1);
            const o = (0.2 + _r(uid * 997 + i + 750) * 0.68).toFixed(2);
            s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" opacity="${o}"/>`;

    function drawCard() {
        const btn      = document.getElementById('tarot-btn');
        const reveal   = document.getElementById('tarot-reveal');
        const flipCard = document.getElementById('flip-card');
        const front    = document.getElementById('flip-front');
        const fortune  = document.getElementById('fortune-text');

        const d   = new Date();
        const key = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
        const card = TAROT[key % 22];

        flipCard.classList.remove('flipped');
        fortune.classList.remove('show');
        fortune.textContent = '';

        front.innerHTML = `
            <div class="card-num">${card.num}</div>
            <div class="card-art-wrap">${makeCardSVG(card)}</div>
            <div class="card-name-plate">
                <div class="card-name-zh">${card.name}</div>
                <div class="card-name-en">${card.en}</div>
            </div>`;

        reveal.style.display = 'flex';
        btn.style.display = 'none';

        setTimeout(() => {
            flipCard.classList.add('flipped');
            setTimeout(() => {
                fortune.textContent = card.fortune;
                fortune.classList.add('show');
            }, 650);
        }, 900);
    }

    // ─── Divination animation ───
    function startDivination(navBtn) {
        if (window.innerWidth <= 768) closeSidebar();

        const overlay = document.getElementById('div-overlay');
        const scene   = document.getElementById('cb-scene');
        const aurora1 = document.getElementById('cb-aurora1');
        const aurora2 = document.getElementById('cb-aurora2');
        const iglow   = document.getElementById('cb-iglow');
        const otext   = document.getElementById('oracle-text');
        const flash   = document.getElementById('screen-flash');
        const canvas  = document.getElementById('anim-canvas');

        scene.classList.remove('appear');
        aurora1.classList.remove('on');
        aurora2.classList.remove('on');
        iglow.classList.remove('bright');
        otext.classList.remove('visible');
        flash.classList.remove('flash');

        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const CX = canvas.width  / 2;
        const CY = canvas.height / 2 - 42;
        const BR = 110;

        let particles = [];
        let rings     = [];
        let animTime  = 0;
        let running   = true;
        let rafId;

        const ORB_CFG = [
            { count: 3, r: 130, spd:  0.010, sz: 4.5, col: [168, 130, 255] },
            { count: 5, r: 165, spd: -0.007, sz: 3.0, col: [255, 212,  75] },
            { count: 8, r: 200, spd:  0.004, sz: 2.0, col: [ 75, 210, 255] },
        ];
        const orbiters = [];
        ORB_CFG.forEach(cfg => {
            for (let i = 0; i < cfg.count; i++) {
                orbiters.push({
                    a: (i / cfg.count) * Math.PI * 2,
                    r: cfg.r, spd: cfg.spd, sz: cfg.sz,
                    col: cfg.col, alpha: 0
                });
            }
        });

        function spawnSparkle() {
            const ang = Math.random() * Math.PI * 2;
            const rad = BR * (0.2 + Math.random() * 0.8);
            particles.push({
                x:    CX + Math.cos(ang) * rad,
                y:    CY + Math.sin(ang) * rad,
                vx:   (Math.random() - 0.5) * 0.55,
                vy:   -(0.3 + Math.random() * 1.7),
                sz:   0.8 + Math.random() * 3.0,
                life: 1,
                dec:  0.007 + Math.random() * 0.010,
                col:  Math.random() > 0.45 ? [255, 215, 88] : [200, 170, 255],
            });
        }

        function spawnRing(r0, endR, col) {
            rings.push({ r: r0, end: endR, life: 1.0, col });
        }

        function loop() {
            if (!running) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animTime++;

            const prog   = Math.min(animTime / 252, 1);
            const climax = Math.max(0, (prog - 0.80) / 0.20);

            const orbFade = Math.min(1, Math.max(0, (prog - 0.10) / 0.28));
            orbiters.forEach(o => {
                o.a    += o.spd * (1 + climax * 2.5);
                o.alpha = orbFade * (0.58 + climax * 0.42);
            });

            const sparkEvery = climax > 0.2 ? 1 : prog > 0.12 ? 2 : 9999;
            if (animTime % sparkEvery === 0) spawnSparkle();

            if (animTime === 52)  spawnRing(8, BR * 2.3, [140, 100, 255]);
            if (animTime === 118) spawnRing(8, BR * 3.0, [100, 180, 255]);
            if (animTime === 182) spawnRing(8, BR * 2.6, [255, 200,  80]);
            if (animTime === 228) spawnRing(8, BR * 3.6, [255, 255, 255]);

            rings.forEach(ring => {
                ring.r    += (ring.end - ring.r) * 0.028;
                ring.life -= 0.009;
                if (ring.life > 0) {
                    const [rr, gg, bb] = ring.col;
                    ctx.beginPath();
                    ctx.arc(CX, CY, ring.r, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${rr},${gg},${bb},${ring.life * 0.42})`;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            });
            rings = rings.filter(r => r.life > 0);

            orbiters.forEach(o => {
                const x = CX + Math.cos(o.a) * o.r;
                const y = CY + Math.sin(o.a) * o.r;
                const [rr, gg, bb] = o.col;
                const a = o.alpha;

                const grd = ctx.createRadialGradient(x, y, 0, x, y, o.sz * 5.5);
                grd.addColorStop(0, `rgba(${rr},${gg},${bb},${a * 0.62})`);
                grd.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
                ctx.beginPath();
                ctx.arc(x, y, o.sz * 5.5, 0, Math.PI * 2);
                ctx.fillStyle = grd;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x, y, o.sz, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${rr},${gg},${bb},${a})`;
                ctx.fill();

                if (climax > 0.15) {
                    for (let t = 1; t <= 4; t++) {
                        const ta = o.a - o.spd * t * 5;
                        const tx = CX + Math.cos(ta) * o.r;
                        const ty = CY + Math.sin(ta) * o.r;
                        const ts = Math.max(0, o.sz * (1 - t * 0.22));
                        ctx.beginPath();
                        ctx.arc(tx, ty, ts, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${rr},${gg},${bb},${a * (1 - t * 0.22) * climax * 0.75})`;
                        ctx.fill();
                    }
                }
            });

            particles.forEach(p => {
                p.x   += p.vx;
                p.y   += p.vy;
                p.vy  *= 0.988;
                p.life -= p.dec;
                if (p.life > 0) {
                    const [rr, gg, bb] = p.col;
                    const s = p.sz * p.life;
                    if (p.sz > 2.0) {
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(Math.PI / 4);
                        ctx.fillStyle = `rgba(${rr},${gg},${bb},${p.life * 0.88})`;
                        ctx.fillRect(-s * 0.5, -s * 0.5, s, s);
                        ctx.restore();
                    } else {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${rr},${gg},${bb},${p.life * 0.78})`;
                        ctx.fill();
                    }
                }
            });
            particles = particles.filter(p => p.life > 0);

            if (climax > 0) {
                const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, BR * 3.5);
                grd.addColorStop(0,   `rgba(255,240,175,${climax * 0.32})`);
                grd.addColorStop(0.4, `rgba(201,162, 39,${climax * 0.10})`);
                grd.addColorStop(1,   `rgba(255,255,255,0)`);
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            if (animTime < 262) rafId = requestAnimationFrame(loop);
        }

        overlay.style.display = 'flex';
        void overlay.offsetWidth;
        overlay.classList.add('show');

        setTimeout(() => scene.classList.add('appear'),  150);
        setTimeout(() => {
            aurora1.classList.add('on');
            aurora2.classList.add('on');
            rafId = requestAnimationFrame(loop);
        }, 460);
        setTimeout(() => otext.classList.add('visible'), 1450);
        setTimeout(() => iglow.classList.add('bright'),  1950);
        setTimeout(() => flash.classList.add('flash'),   3960);

        setTimeout(() => {
            running = false;
            cancelAnimationFrame(rafId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            showPage('divination', navBtn);
            overlay.classList.remove('show');
            aurora1.classList.remove('on');
            aurora2.classList.remove('on');
            iglow.classList.remove('bright');
            otext.classList.remove('visible');
            flash.classList.remove('flash');
            scene.classList.remove('appear');

            setTimeout(() => { overlay.style.display = 'none'; }, 660);

            // Reset tarot for fresh draw
            const tarotBtn    = document.getElementById('tarot-btn');
            const tarotReveal = document.getElementById('tarot-reveal');
            const flipCard    = document.getElementById('flip-card');
            const fortuneEl   = document.getElementById('fortune-text');
            if (tarotBtn)    tarotBtn.style.display = '';
            if (tarotReveal) tarotReveal.style.display = 'none';
            if (flipCard)    flipCard.classList.remove('flipped');
            if (fortuneEl)   { fortuneEl.classList.remove('show'); fortuneEl.textContent = ''; }
        }, 4260);
    }
