<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鷗哩手作 - 水晶小學堂</title>
    <style>
        :root {
            --primary-blue: #243b55;
            --accent-gold: #d4af37;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --hover-blue: #1c2e44;
        }

        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-image: url('picture/background/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* 側邊欄導覽 */
        .sidebar {
            width: 250px;
            background: rgba(36, 59, 85, 0.9);
            color: white;
            padding: 2rem 1rem;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 1rem;
        }

        /* 選單樣式 */
        .menu-item {
            margin-bottom: 0.5rem;
        }

        .menu-btn {
            width: 100%;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* 子選單 */
        .submenu {
            padding-left: 1.5rem;
            margin-top: 5px;
            display: none; /* 預設隱藏，點擊後展開 */
        }

        .submenu.active {
            display: block;
        }

        .sub-link {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 8px 10px;
            font-size: 0.9rem;
            border-radius: 5px;
            margin-bottom: 2px;
            transition: 0.3s;
        }

        .sub-link:hover {
            background: rgba(212, 175, 55, 0.2);
            color: white;
        }

        /* 主內容區 */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .content-card {
            background: var(--glass-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        h1 { 
            color: var(--primary-blue);
            margin-bottom: 1rem;
            font-size: 2.2rem;
        }

        p { 
            color: #555;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .crystal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

    </style>
</head>
<body>

    <!-- 側邊導覽列 -->
    <div class="sidebar">
        <div class="logo">鷗哩手作</div>
        
        <div class="menu-item">
            <button class="menu-btn" onclick="toggleSubmenu('academy')">
                💎 水晶小學堂 <span>▾</span>
            </button>
            <div id="academy" class="submenu">
                <a href="#" class="sub-link">🔮 紫水晶</a>
                <a href="#" class="sub-link">☀️ 黃水晶</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" onclick="toggleSubmenu('crystal-handmade')">
                📿 水晶礦石手作 <span>▾</span>
            </button>
            <div id="crystal-handmade" class="submenu">
                <a href="#" class="sub-link">⚪ 串珠</a>
                <a href="#" class="sub-link">🧶 編織</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn">
                🪵 木製飾品
            </button>
        </div>

        <div class="menu-item">
            <button class="menu-btn">
                🏠 返回首頁
            </button>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="main-content">
        <div class="content-card">
            <span class="crystal-icon">✨</span>
            <h1>歡迎來到 鷗哩手作</h1>
            <p>點擊左側的「水晶小學堂」，探索各種水晶的奧秘與能量。<br>我們致力於將大自然的禮物，轉化為陪伴您的精美手作。</p>
        </div>
    </div>

    <script>
        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            submenu.classList.toggle('active');
            
            // 旋轉箭頭的小動畫（可選）
            const btn = submenu.previousElementSibling;
            const span = btn.querySelector('span');
            if (submenu.classList.contains('active')) {
                span.style.transform = 'rotate(180deg)';
                span.style.display = 'inline-block';
            } else {
                span.style.transform = 'rotate(0deg)';
            }
        }
    </script>
</body>
</html>
