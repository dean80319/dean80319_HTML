<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鷗哩手作 - 水晶小學堂</title>
    <style>
        :root {
            --primary-blue: #243b55;
            --accent-gold: #d4af37;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --hover-blue: #1c2e44;
        }

        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-image: url('picture/background/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* 側邊欄導覽 */
        .sidebar {
            width: 250px;
            background: rgba(36, 59, 85, 0.9);
            color: white;
            padding: 2rem 1rem;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            box-sizing: border-box;
            transition: margin-left 0.3s ease, box-shadow 0.3s ease;
        }

        .sidebar.collapsed {
            margin-left: -250px;
            box-shadow: none;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 1rem;
        }

        /* 選單樣式 */
        .menu-item {
            margin-bottom: 0.5rem;
        }

        .menu-btn {
            width: 100%;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* 子選單 */
        .submenu {
            padding-left: 1.5rem;
            margin-top: 5px;
            display: none; /* 預設隱藏，點擊後展開 */
        }

        .submenu.active {
            display: block;
        }

        .sub-link {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 8px 10px;
            font-size: 0.9rem;
            border-radius: 5px;
            margin-bottom: 2px;
            transition: 0.3s;
        }

        .sub-link:hover {
            background: rgba(212, 175, 55, 0.2);
            color: white;
        }

        /* 主內容區 */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        /* 收放側邊欄按鈕 */
        .toggle-sidebar-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(36, 59, 85, 0.9);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .toggle-sidebar-btn:hover {
            background: var(--primary-blue);
            color: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .content-card {
            background: var(--glass-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        h1 { 
            color: var(--primary-blue);
            margin-bottom: 1rem;
            font-size: 2.2rem;
        }

        p { 
            color: #555;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .crystal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

    </style>
</head>
<body>

    <!-- 側邊導覽列 -->
    <div class="sidebar">
        <div class="logo">鷗哩手作</div>
        
        <div class="menu-item">
            <button class="menu-btn" onclick="toggleSubmenu('academy')">
                💎 水晶小學堂 <span>▾</span>
            </button>
            <div id="academy" class="submenu">
                <a href="#" class="sub-link">🔮 紫水晶</a>
                <a href="#" class="sub-link">☀️ 黃水晶</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" onclick="toggleSubmenu('crystal-handmade')">
                📿 水晶礦石手作 <span>▾</span>
            </button>
            <div id="crystal-handmade" class="submenu">
                <a href="#" class="sub-link">⚪ 串珠</a>
                <a href="#" class="sub-link">🧶 編織</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn">
                🪵 木製飾品
            </button>
        </div>

        <div class="menu-item">
            <button class="menu-btn" onclick="showDesigner()">
                ✨ 手鍊DIY
            </button>
        </div>

        <div class="menu-item">
            <button class="menu-btn">
                🏠 返回首頁
            </button>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="main-content">
        <!-- 收放側邊欄按鈕 -->
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()">✕</button>

        <div class="content-card" id="display-area">
            <div id="welcome-msg">
                <span class="crystal-icon">✨</span>
                <h1>歡迎來到 鷗哩手作</h1>
                <p>點擊左側的「水晶小學堂」，探索各種水晶的奧秘與能量。<br>我們致力於將大自然的禮物，轉化為陪伴您的精美手作。</p>
            </div>

            <!-- 手鍊搭配軟體區 (預設隱藏) -->
            <div id="bracelet-designer" style="display: none;">
                <h2 style="color: var(--primary-blue);">✨ 專屬手鍊設計師</h2>
                
                <!-- 尺寸調整 -->
                <div class="control-group">
                    <label>手圍大小: <span id="size-val">14</span> 公分</label>
                    <input type="range" id="bracelet-size" min="12" max="16" step="0.5" value="14">
                </div>

                <!-- 礦石大小選擇 -->
                <div class="select-group">
                    <label for="bead-size">礦石大小:</label>
                    <select id="bead-size">
                        <option value="4">4mm</option>
                        <option value="6" selected>6mm (預設)</option>
                        <option value="8">8mm</option>
                        <option value="10">10mm</option>
                        <option value="12">12mm</option>
                    </select>
                </div>

                <!-- 水晶選擇 -->
                <div class="bead-picker">
                    <div class="bead-option" onclick="addBead('amethyst')" title="紫水晶">
                        <div class="bead-preview amethyst"></div>
                        <span>紫水晶</span>
                    </div>
                    <div class="bead-option" onclick="addBead('citrine')" title="黃水晶">
                        <div class="bead-preview citrine"></div>
                        <span>黃水晶</span>
                    </div>
                    <div class="bead-option" onclick="addBead('aquamarine')" title="海藍寶">
                        <div class="bead-preview aquamarine"></div>
                        <span>海藍寶</span>
                    </div>
                    <div class="bead-option" onclick="addBead('tourmaline')" title="彩碧璽">
                        <div class="bead-preview tourmaline"></div>
                        <span>彩碧璽</span>
                    </div>
                    <div class="bead-option" onclick="addBead('garnet')" title="石榴石">
                        <div class="bead-preview garnet"></div>
                        <span>石榴石</span>
                    </div>
                </div>

                <!-- 手鍊畫布 -->
                <div class="canvas-container">
                    <svg id="bracelet-svg" viewBox="0 0 300 300">
                        <!-- 底圈 -->
                        <circle cx="150" cy="150" r="70" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2" id="base-circle" />
                        <!-- 珠子容器 -->
                        <g id="beads-group"></g>
                    </svg>
                </div>

                <div class="actions">
                    <button class="btn-distribute" onclick="distributeEvenly()">均勻排列</button>
                    <button class="btn-clear" onclick="clearBeads()">重置</button>
                    <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">提示：點擊上方水晶即可加入手鍊；按住水晶可拖曳調整位置</p>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* 新增設計師相關樣式 */
        .control-group { margin: 20px 0; }
        input[type="range"] { width: 100%; accent-color: var(--primary-blue); }
        
        .bead-picker { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        
        .bead-option { cursor: pointer; text-align: center; transition: transform 0.2s; }
        .bead-option:hover { transform: scale(1.1); }
        
        .bead-preview {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 auto 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 水晶顏色設定 */
        .amethyst { background: radial-gradient(circle at 30% 30%, #a29bfe, #6c5ce7); }
        .citrine { background: radial-gradient(circle at 30% 30%, #ffeaa7, #fdcb6e); }
        .aquamarine { background: radial-gradient(circle at 30% 30%, #81ecec, #00cec9); }
        .tourmaline { background: linear-gradient(135deg, #ff7675, #ffeaa7, #55efc4, #a29bfe); }
        .garnet { background: radial-gradient(circle at 30% 30%, #ff7675, #8b0000); }

        .canvas-container {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        /* 礦石大小選擇器樣式 */
        .select-group {
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .select-group label {
            font-weight: bold;
            color: var(--primary-blue);
        }
        .select-group select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
            background-white: white;
            cursor: pointer;
            accent-color: var(--primary-blue);
        }

        #bracelet-svg { width: 100%; max-width: 300px; height: auto; }

        .btn-distribute {
            background: var(--primary-blue);
            color: white;
            border: 1px solid var(--accent-gold);
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-right: 10px;
        }
        .btn-distribute:hover { 
            background: var(--hover-blue);
            color: var(--accent-gold);
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-clear:hover { background: #c0392b; }
    </style>

    <script>
        // 切換顯示設計師
        function showDesigner() {
            document.getElementById('welcome-msg').style.display = 'none';
            document.getElementById('bracelet-designer').style.display = 'block';
            updateBracelet();
        }

        let selectedBeads = [];
        let draggedBeadIndex = null;
        const sizeInput = document.getElementById('bracelet-size');
        const sizeVal = document.getElementById('size-val');
        const beadSizeInput = document.getElementById('bead-size');
        const beadsGroup = document.getElementById('beads-group');
        const baseCircle = document.getElementById('base-circle');
        const braceletSvg = document.getElementById('bracelet-svg');

        sizeInput.addEventListener('input', () => {
            sizeVal.innerText = sizeInput.value;
            updateBracelet();
        });

        // 當選擇大小改變時，不自動更新舊的珠子，只影響之後新增的
        beadSizeInput.addEventListener('change', () => {
            // updateBracelet(); // 移除此行以保留個別珠子大小
        });

        function getNextBeadAngle() {
            if (selectedBeads.length === 0) {
                return 0; // 第一顆放在 0 度 (右側)
            }
            if (selectedBeads.length === 1) {
                // 第二顆放在對向 (180度)
                return (selectedBeads[0].angle + Math.PI) % (2 * Math.PI);
            }

            // 取得所有珠子的角度並正規化到 [0, 2*Math.PI)
            const angles = selectedBeads.map(b => {
                let a = b.angle % (2 * Math.PI);
                if (a < 0) a += 2 * Math.PI;
                return a;
            });

            // 排序
            angles.sort((a, b) => a - b);

            // 尋找最大空隙
            let maxGap = 0;
            let insertAngle = 0;

            for (let i = 0; i < angles.length; i++) {
                const current = angles[i];
                const next = angles[(i + 1) % angles.length];
                
                let gap;
                if (next > current) {
                    gap = next - current;
                } else {
                    // 跨越 0 度的最後一個間隙
                    gap = (next + 2 * Math.PI) - current;
                }

                if (gap > maxGap) {
                    maxGap = gap;
                    insertAngle = (current + gap / 2) % (2 * Math.PI);
                }
            }

            return insertAngle;
        }

        function addBead(type) {
            if (selectedBeads.length >= 24) return; // 限制數量
            const currentSize = parseFloat(beadSizeInput.value) || 6;
            
            // 計算新珠子的最佳角度，使其在最大空隙中且不影響其他已移動水晶
            const nextAngle = getNextBeadAngle();
            selectedBeads.push({ type: type, size: currentSize, angle: nextAngle });
            updateBracelet();
        }

        function redistributeBeads() {
            const count = selectedBeads.length;
            selectedBeads.forEach((bead, index) => {
                bead.angle = (index / count) * 2 * Math.PI;
            });
        }

        function distributeEvenly() {
            redistributeBeads();
            updateBracelet();
        }

        function clearBeads() {
            selectedBeads = [];
            updateBracelet();
        }

        function updateBracelet() {
            const sizeCm = parseFloat(sizeInput.value);
            // 比例換算：14cm 對應 70px 半徑
            const radius = (sizeCm / 14) * 70;
            baseCircle.setAttribute('r', radius);

            beadsGroup.innerHTML = '';

            selectedBeads.forEach((beadData, index) => {
                const type = beadData.type;
                const beadSize = beadData.size;
                const beadRadius = beadSize * (8 / 6); // 基礎 6mm 對應 8px 半徑
                const angle = beadData.angle;

                const x = 150 + radius * Math.cos(angle);
                const y = 150 + radius * Math.sin(angle);

                const bead = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                bead.setAttribute("cx", x);
                bead.setAttribute("cy", y);
                bead.setAttribute("r", beadRadius); 
                bead.setAttribute("class", "draggable-bead");
                bead.setAttribute("data-index", index);
                
                bead.setAttribute("fill", getBeadColor(type));
                bead.setAttribute("stroke", draggedBeadIndex === index ? "#d4af37" : "rgba(255,255,255,0.3)");
                bead.setAttribute("stroke-width", draggedBeadIndex === index ? "2" : "1");
                
                bead.style.filter = "drop-shadow(2px 2px 2px rgba(0,0,0,0.3))";
                bead.style.cursor = "grab";
                
                // 滑鼠拖拽事件
                bead.addEventListener('mousedown', (e) => {
                    draggedBeadIndex = index;
                    bead.style.cursor = "grabbing";
                    e.stopPropagation();
                });

                beadsGroup.appendChild(bead);
            });
        }

        // SVG 全局滑鼠事件處理拖拽
        braceletSvg.addEventListener('mousemove', (e) => {
            if (draggedBeadIndex === null) return;

            // 取得 SVG 的座標系並轉換至 SVG 的 viewBox 比例 (0 到 300)
            const rect = braceletSvg.getBoundingClientRect();
            const svgX = (e.clientX - rect.left) * (300 / rect.width);
            const svgY = (e.clientY - rect.top) * (300 / rect.height);
            
            // 計算相對於中心點 (150, 150) 的偏移量
            const dx = svgX - 150;
            const dy = svgY - 150;

            // 計算弧度角度
            let angle = Math.atan2(dy, dx);
            if (angle < 0) angle += 2 * Math.PI;

            // 更新被拖拽珠子的角度
            selectedBeads[draggedBeadIndex].angle = angle;
            updateBracelet();
        });

        window.addEventListener('mouseup', () => {
            if (draggedBeadIndex !== null) {
                draggedBeadIndex = null;
                updateBracelet();
            }
        });

        // 支援觸控裝置
        braceletSvg.addEventListener('touchmove', (e) => {
            if (draggedBeadIndex === null) return;
            const touch = e.touches[0];
            const rect = braceletSvg.getBoundingClientRect();
            const svgX = (touch.clientX - rect.left) * (300 / rect.width);
            const svgY = (touch.clientY - rect.top) * (300 / rect.height);
            
            const dx = svgX - 150;
            const dy = svgY - 150;

            let angle = Math.atan2(dy, dx);
            if (angle < 0) angle += 2 * Math.PI;

            selectedBeads[draggedBeadIndex].angle = angle;
            updateBracelet();
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (draggedBeadIndex !== null) {
                draggedBeadIndex = null;
                updateBracelet();
            }
        });

        function getBeadColor(type) {
            const colors = {
                amethyst: "#6c5ce7",
                citrine: "#fdcb6e",
                aquamarine: "#00cec9",
                tourmaline: "#ff7675",
                garnet: "#8b0000"
            };
            return colors[type] || "#cccccc";
        }

        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            submenu.classList.toggle('active');
            const btn = submenu.previousElementSibling;
            const span = btn.querySelector('span');
            if (submenu.classList.contains('active')) {
                span.style.transform = 'rotate(180deg)';
                span.style.display = 'inline-block';
            } else {
                span.style.transform = 'rotate(0deg)';
            }
        }

        // 收放側邊欄功能
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('collapsed');
            
            const toggleBtn = document.querySelector('.toggle-sidebar-btn');
            if (sidebar.classList.contains('collapsed')) {
                toggleBtn.innerHTML = '☰';
            } else {
                toggleBtn.innerHTML = '✕';
            }
        }
    </script>
</body>
</html>
