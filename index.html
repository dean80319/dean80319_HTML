<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鷗哩手作</title>
    <!-- Noto Sans TC: Traditional Chinese web font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sw: 260px;
            --gold: #c9a227;
            --gold-lt: #e8d07a;
            --border: rgba(255,255,255,0.08);
            --text: rgba(255,255,255,0.92);
            --dim: rgba(255,255,255,0.45);
            --card: rgba(255,255,255,0.07);
            --t: 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", "PingFang TC", sans-serif;
            color: var(--text);
            background: #080c1e;
        }

        /* ── Deep-space background ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: -2;
            background:
                radial-gradient(ellipse 70% 60% at 15% 15%, rgba(90,30,180,0.18) 0%, transparent 65%),
                radial-gradient(ellipse 55% 70% at 85% 75%, rgba(20,55,140,0.22) 0%, transparent 65%),
                linear-gradient(150deg, #07091a 0%, #0d1230 45%, #110820 100%);
        }

        /* ── Star field (with twinkling) ── */
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: -1;
            background-image:
                radial-gradient(1.2px 1.2px at 12% 22%, rgba(255,255,255,0.45) 0%, transparent 100%),
                radial-gradient(1px   1px   at 33% 68%, rgba(255,255,255,0.30) 0%, transparent 100%),
                radial-gradient(1px   1px   at 58% 30%, rgba(255,255,255,0.38) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 78% 78%, rgba(255,255,255,0.28) 0%, transparent 100%),
                radial-gradient(1px   1px   at 91% 12%, rgba(255,255,255,0.42) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 45% 88%, rgba(255,255,255,0.22) 0%, transparent 100%),
                radial-gradient(2px   2px   at  8% 83%, rgba(201,162,39,0.28)  0%, transparent 100%),
                radial-gradient(2px   2px   at 70% 93%, rgba(201,162,39,0.18)  0%, transparent 100%),
                radial-gradient(1px   1px   at 25% 45%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px   1px   at 67% 15%, rgba(255,255,255,0.40) 0%, transparent 100%),
                radial-gradient(1.2px 1.2px at 82% 38%, rgba(255,255,255,0.30) 0%, transparent 100%),
                radial-gradient(1px   1px   at 48% 72%, rgba(255,255,255,0.25) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 15% 57%, rgba(255,255,255,0.20) 0%, transparent 100%),
                radial-gradient(1px   1px   at 93% 55%, rgba(255,255,255,0.32) 0%, transparent 100%),
                radial-gradient(2px   2px   at 37%  5%, rgba(201,162,39,0.22)  0%, transparent 100%),
                radial-gradient(1px   1px   at 55% 50%, rgba(255,255,255,0.18) 0%, transparent 100%),
                radial-gradient(1.3px 1.3px at  3% 40%, rgba(255,255,255,0.28) 0%, transparent 100%);
            animation: starTwinkle 8s ease-in-out infinite alternate;
        }

        @keyframes starTwinkle {
            0%   { opacity: 0.6; }
            100% { opacity: 1.0; }
        }

        /* ═══════════════════════════════════════════
           LAYOUT
        ═══════════════════════════════════════════ */
        .layout { display: flex; height: 100vh; overflow: hidden; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sw);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(7,9,26,0.96);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 300;
            /* Desktop collapse: margin-left (resizes main area) */
            transition: margin-left var(--t);
        }

        .sidebar.collapsed { margin-left: calc(-1 * var(--sw)); }

        /* Sidebar: logo */
        .sb-logo {
            padding: 1.8rem 1.5rem 1.4rem;
            border-bottom: 1px solid var(--border);
            text-align: center;
            flex-shrink: 0;
        }

        .sb-brand {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #b8891a 0%, var(--gold-lt) 50%, #b8891a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sb-tagline {
            font-size: 0.68rem;
            letter-spacing: 3.5px;
            color: var(--dim);
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Sidebar: nav */
        .sb-nav {
            flex: 1;
            padding: 0.9rem 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 12px;
            background: none;
            border: 1px solid transparent;
            border-radius: 10px;
            color: var(--dim);
            font-size: 0.88rem;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--t);
            text-align: left;
        }

        .nav-btn .ico { font-size: 1.05rem; flex-shrink: 0; }
        .nav-btn .lbl { flex: 1; }
        .nav-btn .arr { font-size: 0.65rem; transition: transform var(--t); }
        .nav-btn .arr.open { transform: rotate(90deg); }

        .nav-btn:hover {
            background: rgba(201,162,39,0.07);
            border-color: rgba(201,162,39,0.18);
            color: var(--text);
        }

        .nav-btn:hover .ico { filter: drop-shadow(0 0 7px rgba(201,162,39,0.55)); }

        /* Active nav state */
        .nav-btn.active {
            background: rgba(201,162,39,0.12);
            border-color: rgba(201,162,39,0.30);
            color: var(--gold-lt);
        }

        .nav-btn.active .ico { filter: drop-shadow(0 0 8px rgba(201,162,39,0.65)); }

        /* Focus-visible for keyboard users */
        .nav-btn:focus-visible,
        .toggle-btn:focus-visible,
        .btn:focus-visible,
        .sub-link:focus-visible {
            outline: 2px solid rgba(201,162,39,0.65);
            outline-offset: 2px;
        }

        /* Sidebar: submenu */
        .submenu {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease;
            padding-left: 8px;
        }

        .submenu.open { max-height: 200px; }

        .sub-link {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 12px;
            color: var(--dim);
            font-size: 0.82rem;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--t);
            /* Reset button styles */
            background: none;
            border: none;
            width: 100%;
            font-family: inherit;
            text-align: left;
        }

        .sub-link:hover { background: rgba(255,255,255,0.05); color: var(--text); }

        .nav-sep { height: 1px; background: var(--border); margin: 5px 3px; }

        /* Sidebar: footer */
        .sb-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.68rem;
            color: var(--dim);
            text-align: center;
            flex-shrink: 0;
        }

        /* ── MAIN ── */
        .main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-width: 0;
        }

        /* Mobile backdrop (shown only on mobile via media query) */
        .sb-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 299;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--t);
        }

        .sb-backdrop.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* Toggle button */
        .toggle-btn {
            position: absolute;
            top: 1.2rem;
            left: 1.2rem;
            z-index: 200;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.055);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--t);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toggle-btn:hover {
            background: rgba(201,162,39,0.10);
            border-color: rgba(201,162,39,0.30);
            color: var(--gold-lt);
        }

        /* ═══════════════════════════════════════════
           PAGES
        ═══════════════════════════════════════════ */
        .page {
            display: none;
            width: 100%;
            max-width: 600px;
            max-height: calc(100vh - 3.5rem);
            overflow-y: auto;
            padding: 0 1rem;
            animation: fadeUp 0.38s ease;
        }

        .page.active { display: block; }

        .page::-webkit-scrollbar { width: 3px; }
        .page::-webkit-scrollbar-track { background: transparent; }
        .page::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Glass card */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 1px solid rgba(201,162,39,0.30);
            border-radius: 22px;
            padding: 2.4rem 2.2rem;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.025),
                0 22px 64px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* ═══════════════════════════════════════════
           WELCOME PAGE
        ═══════════════════════════════════════════ */
        .welcome-icon {
            font-size: 3.6rem;
            display: block;
            text-align: center;
            margin-bottom: 1.2rem;
            animation: floatY 4s ease-in-out infinite;
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0);    }
            50%       { transform: translateY(-9px); }
        }

        .welcome-title {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            background: linear-gradient(130deg, #fff 10%, var(--gold-lt) 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-body {
            text-align: center;
            color: var(--dim);
            font-size: 0.92rem;
            line-height: 1.9;
        }

        .tag-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 1.6rem;
        }

        .tag {
            padding: 5px 13px;
            border-radius: 20px;
            background: rgba(201,162,39,0.09);
            border: 1px solid rgba(201,162,39,0.22);
            font-size: 0.78rem;
            color: var(--gold-lt);
            letter-spacing: 0.5px;
        }

        /* ═══════════════════════════════════════════
           BRACELET DESIGNER
        ═══════════════════════════════════════════ */
        .sec-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.9rem;
        }

        .ctrl-lbl {
            font-size: 0.82rem;
            color: var(--dim);
            white-space: nowrap;
            width: 62px;
        }

        .ctrl-val { color: var(--gold-lt); font-weight: 600; font-size: 0.85rem; }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px; height: 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-lt));
            cursor: pointer;
            box-shadow: 0 0 8px rgba(201,162,39,0.5);
        }

        select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.06);
            color: var(--text);
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        select:focus { border-color: rgba(201,162,39,0.35); }

        /* Crystal picker */
        .crystal-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 1rem 0 0.4rem;
        }

        .c-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: transform var(--t);
            border-radius: 8px;
        }

        .c-opt:hover { transform: translateY(-5px); }

        .c-sphere {
            width: 42px; height: 42px;
            border-radius: 50%;
            position: relative;
            box-shadow:
                0 4px 14px rgba(0,0,0,0.45),
                inset 0 -3px 7px rgba(0,0,0,0.35),
                inset 0 3px 5px rgba(255,255,255,0.28);
            transition: box-shadow var(--t);
        }

        .c-opt:hover .c-sphere {
            box-shadow:
                0 6px 20px rgba(0,0,0,0.5),
                0 0 14px var(--glow, rgba(201,162,39,0.3)),
                inset 0 -3px 7px rgba(0,0,0,0.35),
                inset 0 3px 5px rgba(255,255,255,0.28);
        }

        .c-sphere::after {
            content: '';
            position: absolute;
            top: 17%; left: 17%;
            width: 28%; height: 18%;
            background: rgba(255,255,255,0.58);
            border-radius: 50%;
            transform: rotate(-28deg);
        }

        .c-name { font-size: 0.7rem; color: var(--dim); }

        /* Crystal colours */
        .sph-amethyst   { background: radial-gradient(circle at 35% 30%, #c4b5fd, #7c3aed 50%, #4c1d95); --glow: rgba(124,58,237,0.4); }
        .sph-citrine    { background: radial-gradient(circle at 35% 30%, #fef3c7, #f59e0b 50%, #92400e); --glow: rgba(245,158,11,0.4); }
        .sph-aquamarine { background: radial-gradient(circle at 35% 30%, #a5f3fc, #06b6d4 50%, #164e63); --glow: rgba(6,182,212,0.4);  }
        .sph-tourmaline { background: radial-gradient(circle at 35% 30%, #fda4af, #f43f5e 35%, #6d28d9); --glow: rgba(244,63,94,0.3);  }
        .sph-garnet     { background: radial-gradient(circle at 35% 30%, #fca5a5, #dc2626 50%, #7f1d1d); --glow: rgba(220,38,38,0.4);  }

        /* SVG canvas */
        .svg-wrap {
            background: rgba(0,0,0,0.28);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin: 0.8rem 0;
            display: flex;
            justify-content: center;
        }

        #bracelet-svg { width: 100%; max-width: 250px; height: auto; }

        /* Buttons */
        .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .btn {
            padding: 9px 20px;
            border-radius: 10px;
            font-size: 0.83rem;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--t);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .btn-gold {
            background: rgba(201,162,39,0.10);
            border-color: rgba(201,162,39,0.28);
            color: var(--gold-lt);
        }

        .btn-gold:hover {
            background: rgba(201,162,39,0.18);
            border-color: var(--gold);
            box-shadow: 0 0 14px rgba(201,162,39,0.15);
        }

        .btn-red {
            background: rgba(220,38,38,0.09);
            border-color: rgba(220,38,38,0.22);
            color: #fca5a5;
        }

        .btn-red:hover {
            background: rgba(220,38,38,0.18);
            border-color: rgba(220,38,38,0.50);
        }

        .hint {
            text-align: center;
            font-size: 0.72rem;
            color: var(--dim);
            margin-top: 7px;
        }

        /* ═══════════════════════════════════════════
           DIVINATION RESULT PAGE
        ═══════════════════════════════════════════ */
        .div-icon {
            font-size: 4rem;
            display: block;
            text-align: center;
            margin-bottom: 1rem;
            animation: pulseGem 3s ease-in-out infinite;
        }

        @keyframes pulseGem {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(201,162,39,0.3));  transform: scale(1);    }
            50%       { filter: drop-shadow(0 0 22px rgba(201,162,39,0.7)); transform: scale(1.08); }
        }

        .div-title {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 1.4rem;
            background: linear-gradient(130deg, var(--gold-lt) 0%, #fff 50%, var(--gold-lt) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .div-box {
            border: 1px dashed rgba(201,162,39,0.30);
            border-radius: 14px;
            padding: 1.5rem 1.8rem;
            background: rgba(201,162,39,0.035);
            animation: fadeUp 1s ease;
        }

        .div-line {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 0;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.055);
        }

        .div-line:last-child  { border-bottom: none; padding-bottom: 0; }
        .div-line:first-child { padding-top: 0; }

        .div-line::before {
            content: '✦';
            color: var(--gold);
            font-size: 0.65rem;
            flex-shrink: 0;
        }

        /* ═══════════════════════════════════════════
           DIVINATION ANIMATION OVERLAY
        ═══════════════════════════════════════════ */
        #div-overlay {
            position: fixed; inset: 0;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #0f0a2e 0%, #020617 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #div-overlay.show { opacity: 1; pointer-events: all; }

        .cb-wrap { display: flex; flex-direction: column; align-items: center; }

        .cb-ball {
            width: 220px; height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 130%, rgba(255,255,255,0.11), rgba(255,255,255,0.02) 70%);
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow:
                0 0 50px rgba(120,80,220,0.18),
                inset 0 0 30px rgba(255,255,255,0.07),
                inset 0 -20px 50px rgba(0,0,0,0.70);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(4px);
        }

        .cb-mist {
            position: absolute;
            inset: -10%; width: 120%; height: 120%;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(220,225,235,0.8) 40%, rgba(200,205,215,0.3) 65%, transparent 80%);
            filter: blur(8px);
            opacity: 0;
        }

        .cb-glow {
            position: absolute;
            top: 10%; left: 10%; width: 80%; height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, rgba(201,162,39,0.9) 40%, transparent 70%);
            filter: blur(5px);
            opacity: 0;
            box-shadow: 0 0 60px rgba(201,162,39,0.5);
        }

        .cb-reflex {
            position: absolute;
            top: 9%; left: 16%;
            width: 44px; height: 22px;
            border-radius: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.62), transparent);
            transform: rotate(-28deg);
            pointer-events: none;
        }

        .cb-base {
            width: 130px; height: 40px;
            background: linear-gradient(to right, #4338ca, #1e1b4b 50%, #4338ca);
            border-radius: 8px 8px 14px 14px;
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 12px 24px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.18);
            margin-top: -10px;
            position: relative;
            z-index: -1;
        }

        @keyframes mistOut {
            0%   { opacity: 0; }
            15%  { opacity: 0.95; transform: scale(1)    rotate(0deg);  }
            30%  { opacity: 0.95; transform: scale(1.05) rotate(15deg); }
            100% { opacity: 0;    transform: scale(1.2)  rotate(60deg); }
        }

        @keyframes glowIn {
            0%   { opacity: 0;    transform: scale(0.3);  }
            30%  { opacity: 0.05; transform: scale(0.5);  }
            65%  { opacity: 0.5;  transform: scale(0.85); }
            90%  { opacity: 1;    transform: scale(1.1);  }
            100% { opacity: 1;    transform: scale(1.4); filter: blur(2px); }
        }

        .anim-mist { animation: mistOut 4.2s cubic-bezier(0.25,1,0.5,1) forwards; }
        .anim-glow { animation: glowIn  4.2s cubic-bezier(0.5,0,0.75,0) forwards; }

        #screen-flash {
            position: fixed; inset: 0;
            z-index: 10001;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }

        #screen-flash.flash { opacity: 1; transition: opacity 0.15s ease-out; }

        #fs-mist {
            position: fixed; inset: 0;
            z-index: 9999;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(240,240,245,0.75) 50%, rgba(220,220,230,0.35) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            transform: scale(1);
        }

        #fs-mist.active   { opacity: 1; pointer-events: all; }
        #fs-mist.clearing { opacity: 0; transform: scale(1.5); }

        /* ═══════════════════════════════════════════
           RESPONSIVE — MOBILE
        ═══════════════════════════════════════════ */
        @media (max-width: 768px) {
            /* Sidebar becomes a fixed overlay on mobile */
            .sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                /* Override desktop margin-left collapse */
                margin-left: 0 !important;
                /* Mobile uses transform for GPU-composited slide */
                transform: translateX(-100%);
                transition: transform var(--t);
            }

            .sidebar:not(.collapsed) {
                transform: translateX(0);
            }

            /* Show backdrop only on mobile */
            .sb-backdrop { display: block; }

            /* Main area fills full viewport on mobile */
            .layout { display: block; }
            .main { width: 100%; height: 100vh; }

            .page {
                max-width: 100%;
                padding: 0 0.8rem;
                max-height: calc(100vh - 5rem);
            }

            .card {
                padding: 1.8rem 1.4rem;
                border-radius: 16px;
            }

            .welcome-title { font-size: 1.5rem; }

            .crystal-row { gap: 10px; }
            .c-sphere { width: 36px; height: 36px; }

            .cb-ball { width: 160px; height: 160px; }
        }

        @media (max-width: 480px) {
            .toggle-btn { top: 0.8rem; left: 0.8rem; }
            .page { padding: 0 0.5rem; }
            .card { padding: 1.4rem 1rem; }
        }
    </style>
</head>
<body>

<div class="layout">

    <!-- Mobile backdrop — closes sidebar when tapped -->
    <div class="sb-backdrop" id="sb-backdrop" onclick="closeSidebar()"></div>

    <!-- ═══════════ SIDEBAR ═══════════ -->
    <nav class="sidebar" id="sidebar" aria-label="主選單">

        <div class="sb-logo">
            <div class="sb-brand">鷗哩手作</div>
            <div class="sb-tagline">Handmade Crystal Studio</div>
        </div>

        <div class="sb-nav">

            <div>
                <button class="nav-btn"
                        onclick="toggleSub('sub-academy', this)"
                        aria-expanded="false"
                        aria-controls="sub-academy">
                    <span class="ico">💎</span>
                    <span class="lbl">水晶小學堂</span>
                    <span class="arr">▶</span>
                </button>
                <div class="submenu" id="sub-academy" role="region">
                    <button class="sub-link">🟣 紫水晶</button>
                    <button class="sub-link">🟡 黃水晶</button>
                </div>
            </div>

            <div>
                <button class="nav-btn"
                        onclick="toggleSub('sub-handmade', this)"
                        aria-expanded="false"
                        aria-controls="sub-handmade">
                    <span class="ico">📿</span>
                    <span class="lbl">水晶礦石手作</span>
                    <span class="arr">▶</span>
                </button>
                <div class="submenu" id="sub-handmade" role="region">
                    <button class="sub-link">⚪ 串珠</button>
                    <button class="sub-link">🧶 編織</button>
                </div>
            </div>

            <div>
                <button class="nav-btn">
                    <span class="ico">🪵</span>
                    <span class="lbl">木製飾品</span>
                </button>
            </div>

            <div class="nav-sep"></div>

            <div>
                <button class="nav-btn" id="nav-designer" onclick="showPage('designer', this)">
                    <span class="ico">✨</span>
                    <span class="lbl">手鍊 DIY</span>
                </button>
            </div>

            <div>
                <button class="nav-btn" id="nav-divination" onclick="startDivination(this)">
                    <span class="ico">🔮</span>
                    <span class="lbl">占卜</span>
                </button>
            </div>

            <div class="nav-sep"></div>

            <div>
                <button class="nav-btn active" id="nav-welcome" onclick="showPage('welcome', this)">
                    <span class="ico">🏠</span>
                    <span class="lbl">返回首頁</span>
                </button>
            </div>

        </div>

        <div class="sb-footer">© 2026 鷗哩手作</div>

    </nav>

    <!-- ═══════════ MAIN ═══════════ -->
    <main class="main">

        <button class="toggle-btn" id="toggle-btn"
                onclick="toggleSidebar()"
                aria-label="關閉選單">✕</button>

        <!-- ── Welcome ── -->
        <div class="page active" id="page-welcome">
            <div class="card">
                <span class="welcome-icon">✨</span>
                <h1 class="welcome-title">歡迎來到 鷗哩手作</h1>
                <p class="welcome-body">
                    探索水晶的奧秘與能量<br>
                    讓我們將大自然的禮物<br>
                    轉化為陪伴您的精美手作
                </p>
                <div class="tag-row">
                    <span class="tag">水晶小學堂</span>
                    <span class="tag">手鍊 DIY</span>
                    <span class="tag">礦石手作</span>
                    <span class="tag">水晶占卜</span>
                </div>
            </div>
        </div>

        <!-- ── Bracelet Designer ── -->
        <div class="page" id="page-designer">
            <div class="card">
                <div class="sec-title">✨ 專屬手鍊設計師</div>

                <div class="ctrl">
                    <span class="ctrl-lbl">手圍大小</span>
                    <input type="range" id="bracelet-size" min="12" max="20" step="0.5" value="14"
                           aria-label="手圍大小">
                    <span class="ctrl-val"><span id="size-val">14</span> cm</span>
                </div>

                <div class="ctrl">
                    <span class="ctrl-lbl">礦石大小</span>
                    <select id="bead-size" aria-label="礦石大小">
                        <option value="4">4 mm</option>
                        <option value="6" selected>6 mm</option>
                        <option value="8">8 mm</option>
                        <option value="10">10 mm</option>
                        <option value="12">12 mm</option>
                    </select>
                </div>

                <div class="crystal-row">
                    <div class="c-opt" onclick="addBead('amethyst')"
                         role="button" tabindex="0" aria-label="加入紫水晶">
                        <div class="c-sphere sph-amethyst"></div>
                        <span class="c-name">紫水晶</span>
                    </div>
                    <div class="c-opt" onclick="addBead('citrine')"
                         role="button" tabindex="0" aria-label="加入黃水晶">
                        <div class="c-sphere sph-citrine"></div>
                        <span class="c-name">黃水晶</span>
                    </div>
                    <div class="c-opt" onclick="addBead('aquamarine')"
                         role="button" tabindex="0" aria-label="加入海藍寶">
                        <div class="c-sphere sph-aquamarine"></div>
                        <span class="c-name">海藍寶</span>
                    </div>
                    <div class="c-opt" onclick="addBead('tourmaline')"
                         role="button" tabindex="0" aria-label="加入彩碧璽">
                        <div class="c-sphere sph-tourmaline"></div>
                        <span class="c-name">彩碧璽</span>
                    </div>
                    <div class="c-opt" onclick="addBead('garnet')"
                         role="button" tabindex="0" aria-label="加入石榴石">
                        <div class="c-sphere sph-garnet"></div>
                        <span class="c-name">石榴石</span>
                    </div>
                </div>

                <div class="svg-wrap">
                    <svg id="bracelet-svg" viewBox="0 0 300 300" aria-label="手鍊設計畫布">
                        <defs>
                            <radialGradient id="g-amethyst" cx="35%" cy="30%" r="65%">
                                <stop offset="0%"   stop-color="#c4b5fd"/>
                                <stop offset="50%"  stop-color="#7c3aed"/>
                                <stop offset="100%" stop-color="#3b0764"/>
                            </radialGradient>
                            <radialGradient id="g-citrine" cx="35%" cy="30%" r="65%">
                                <stop offset="0%"   stop-color="#fef3c7"/>
                                <stop offset="50%"  stop-color="#f59e0b"/>
                                <stop offset="100%" stop-color="#78350f"/>
                            </radialGradient>
                            <radialGradient id="g-aquamarine" cx="35%" cy="30%" r="65%">
                                <stop offset="0%"   stop-color="#a5f3fc"/>
                                <stop offset="50%"  stop-color="#06b6d4"/>
                                <stop offset="100%" stop-color="#0c4a6e"/>
                            </radialGradient>
                            <radialGradient id="g-tourmaline" cx="35%" cy="30%" r="65%">
                                <stop offset="0%"   stop-color="#fda4af"/>
                                <stop offset="38%"  stop-color="#f43f5e"/>
                                <stop offset="100%" stop-color="#581c87"/>
                            </radialGradient>
                            <radialGradient id="g-garnet" cx="35%" cy="30%" r="65%">
                                <stop offset="0%"   stop-color="#fca5a5"/>
                                <stop offset="50%"  stop-color="#dc2626"/>
                                <stop offset="100%" stop-color="#450a0a"/>
                            </radialGradient>
                            <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                            <filter id="bead-shadow" x="-30%" y="-30%" width="160%" height="160%">
                                <feDropShadow dx="1" dy="2" stdDeviation="2.2" flood-opacity="0.55"/>
                            </filter>
                        </defs>
                        <!-- Bracelet ring -->
                        <circle cx="150" cy="150" id="base-circle"
                                fill="none"
                                stroke="rgba(201,162,39,0.28)"
                                stroke-width="1.5"
                                stroke-dasharray="5 3.5"
                                filter="url(#ring-glow)"
                                r="70"/>
                        <!-- Empty-state hint -->
                        <text id="svg-hint"
                              x="150" y="158"
                              text-anchor="middle"
                              fill="rgba(255,255,255,0.22)"
                              font-size="11"
                              font-family="'Noto Sans TC', sans-serif">點擊上方水晶開始設計</text>
                        <g id="beads-group"></g>
                    </svg>
                </div>

                <div class="btn-row">
                    <button class="btn btn-gold" onclick="distributeEvenly()">均勻排列</button>
                    <button class="btn btn-red"  onclick="clearBeads()">重置</button>
                </div>
                <p class="hint">點擊水晶加入手鍊 &middot; 按住珠子可拖曳調整位置</p>
            </div>
        </div>

        <!-- ── Divination Result ── -->
        <div class="page" id="page-divination">
            <div class="card">
                <span class="div-icon">🔮</span>
                <h1 class="div-title">命運啟示</h1>
                <div class="div-box">
                    <div class="div-line">占術：看見、解釋、當下</div>
                    <div class="div-line">卜術：預測、宏觀、未來</div>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- ═══════════ OVERLAYS ═══════════ -->
<div id="div-overlay">
    <div class="cb-wrap">
        <div class="cb-ball">
            <div class="cb-mist" id="cb-mist"></div>
            <div class="cb-glow" id="cb-glow"></div>
            <div class="cb-reflex"></div>
        </div>
        <div class="cb-base"></div>
    </div>
</div>
<div id="screen-flash"></div>
<div id="fs-mist"></div>

<script>
    // ─── Page switching ───
    function showPage(id, navBtn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const el = document.getElementById('page-' + id);
        if (el) el.classList.add('active');
        if (id === 'designer') updateBracelet();

        // Update active nav highlight
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if (navBtn) navBtn.classList.add('active');

        // Close sidebar on mobile after navigation
        if (window.innerWidth <= 768) closeSidebar();
    }

    // ─── Sidebar ───
    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        if (sb.classList.contains('collapsed')) {
            openSidebar();
        } else {
            closeSidebar();
        }
    }

    function openSidebar() {
        const sb       = document.getElementById('sidebar');
        const btn      = document.getElementById('toggle-btn');
        const backdrop = document.getElementById('sb-backdrop');
        sb.classList.remove('collapsed');
        btn.textContent = '✕';
        btn.setAttribute('aria-label', '關閉選單');
        backdrop.classList.add('visible');
    }

    function closeSidebar() {
        const sb       = document.getElementById('sidebar');
        const btn      = document.getElementById('toggle-btn');
        const backdrop = document.getElementById('sb-backdrop');
        sb.classList.add('collapsed');
        btn.textContent = '☰';
        btn.setAttribute('aria-label', '開啟選單');
        backdrop.classList.remove('visible');
    }

    function toggleSub(id, btn) {
        const sub   = document.getElementById(id);
        const arrow = btn.querySelector('.arr');
        const isOpen = sub.classList.contains('open');
        sub.classList.toggle('open');
        arrow.classList.toggle('open');
        btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
    }

    // Auto-collapse sidebar on mobile at load
    if (window.innerWidth <= 768) closeSidebar();

    // ─── Bracelet Designer ───
    let selectedBeads    = [];
    let draggedBeadIndex = null;

    const sizeInput     = document.getElementById('bracelet-size');
    const sizeValSpan   = document.getElementById('size-val');
    const beadSizeInput = document.getElementById('bead-size');
    const beadsGroup    = document.getElementById('beads-group');
    const baseCircle    = document.getElementById('base-circle');
    const braceletSvg   = document.getElementById('bracelet-svg');
    const svgHint       = document.getElementById('svg-hint');

    sizeInput.addEventListener('input', () => {
        sizeValSpan.textContent = sizeInput.value;
        updateBracelet();
    });

    function getNextBeadAngle() {
        if (selectedBeads.length === 0) return 0;
        if (selectedBeads.length === 1) return (selectedBeads[0].angle + Math.PI) % (2 * Math.PI);

        const angles = selectedBeads.map(b => {
            let a = b.angle % (2 * Math.PI);
            return a < 0 ? a + 2 * Math.PI : a;
        }).sort((a, b) => a - b);

        let maxGap = 0, insertAngle = 0;
        for (let i = 0; i < angles.length; i++) {
            const cur = angles[i];
            const nxt = angles[(i + 1) % angles.length];
            const gap = nxt > cur ? nxt - cur : nxt + 2 * Math.PI - cur;
            if (gap > maxGap) { maxGap = gap; insertAngle = (cur + gap / 2) % (2 * Math.PI); }
        }
        return insertAngle;
    }

    function addBead(type) {
        if (selectedBeads.length >= 24) return;
        const size = parseFloat(beadSizeInput.value) || 6;
        selectedBeads.push({ type, size, angle: getNextBeadAngle() });
        updateBracelet();
    }

    function distributeEvenly() {
        const n = selectedBeads.length;
        selectedBeads.forEach((b, i) => { b.angle = (i / n) * 2 * Math.PI; });
        updateBracelet();
    }

    function clearBeads() {
        selectedBeads = [];
        updateBracelet();
    }

    const NS = "http://www.w3.org/2000/svg";

    function updateBracelet() {
        const sizeCm = parseFloat(sizeInput.value);
        const radius = (sizeCm / 14) * 70;
        baseCircle.setAttribute('r', radius);
        beadsGroup.innerHTML = '';

        // Empty-state hint visibility
        svgHint.style.display = selectedBeads.length === 0 ? '' : 'none';

        selectedBeads.forEach((bead, index) => {
            const r = bead.size * (8 / 6);
            const x = 150 + radius * Math.cos(bead.angle);
            const y = 150 + radius * Math.sin(bead.angle);
            const isDragging = draggedBeadIndex === index;

            const circle = document.createElementNS(NS, "circle");
            circle.setAttribute("cx", x);
            circle.setAttribute("cy", y);
            circle.setAttribute("r", r);
            circle.setAttribute("fill", `url(#g-${bead.type})`);
            circle.setAttribute("stroke", isDragging ? "#e8d07a" : "rgba(255,255,255,0.2)");
            circle.setAttribute("stroke-width", isDragging ? "2" : "1");
            circle.setAttribute("filter", "url(#bead-shadow)");
            circle.style.cursor = isDragging ? "grabbing" : "grab";

            circle.addEventListener('mousedown', e => {
                draggedBeadIndex = index;
                circle.style.cursor = "grabbing";
                e.stopPropagation();
            });

            circle.addEventListener('touchstart', e => {
                draggedBeadIndex = index;
                e.stopPropagation();
            }, { passive: true });

            beadsGroup.appendChild(circle);

            // Specular highlight
            const shine = document.createElementNS(NS, "ellipse");
            const ox = Math.cos(bead.angle - 0.6) * r * 0.28;
            const oy = Math.sin(bead.angle - 0.6) * r * 0.28;
            shine.setAttribute("cx", x + ox - r * 0.12);
            shine.setAttribute("cy", y + oy - r * 0.12);
            shine.setAttribute("rx", r * 0.24);
            shine.setAttribute("ry", r * 0.14);
            shine.setAttribute("fill", "rgba(255,255,255,0.5)");
            shine.setAttribute("transform", `rotate(-28,${x},${y})`);
            shine.style.pointerEvents = "none";
            beadsGroup.appendChild(shine);
        });
    }

    // Drag — mouse
    braceletSvg.addEventListener('mousemove', e => {
        if (draggedBeadIndex === null) return;
        const rect = braceletSvg.getBoundingClientRect();
        const svgX = (e.clientX - rect.left) * (300 / rect.width);
        const svgY = (e.clientY - rect.top)  * (300 / rect.height);
        let angle = Math.atan2(svgY - 150, svgX - 150);
        if (angle < 0) angle += 2 * Math.PI;
        selectedBeads[draggedBeadIndex].angle = angle;
        updateBracelet();
    });

    window.addEventListener('mouseup', () => {
        if (draggedBeadIndex !== null) { draggedBeadIndex = null; updateBracelet(); }
    });

    // Drag — touch
    braceletSvg.addEventListener('touchmove', e => {
        if (draggedBeadIndex === null) return;
        const touch = e.touches[0];
        const rect  = braceletSvg.getBoundingClientRect();
        const svgX  = (touch.clientX - rect.left) * (300 / rect.width);
        const svgY  = (touch.clientY - rect.top)  * (300 / rect.height);
        let angle   = Math.atan2(svgY - 150, svgX - 150);
        if (angle < 0) angle += 2 * Math.PI;
        selectedBeads[draggedBeadIndex].angle = angle;
        updateBracelet();
        e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', () => {
        if (draggedBeadIndex !== null) { draggedBeadIndex = null; updateBracelet(); }
    });

    // Keyboard support for crystal picker
    document.querySelectorAll('.c-opt').forEach(opt => {
        opt.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); opt.click(); }
        });
    });

    // ─── Divination animation ───
    function startDivination(navBtn) {
        // Close sidebar on mobile immediately
        if (window.innerWidth <= 768) closeSidebar();

        const overlay = document.getElementById('div-overlay');
        const mist    = document.getElementById('cb-mist');
        const glow    = document.getElementById('cb-glow');
        const flash   = document.getElementById('screen-flash');
        const fsMist  = document.getElementById('fs-mist');

        overlay.style.display = 'flex';
        overlay.classList.remove('show');
        mist.classList.remove('anim-mist');
        glow.classList.remove('anim-glow');
        flash.classList.remove('flash');
        fsMist.classList.add('active');
        fsMist.classList.remove('clearing');

        void overlay.offsetWidth; // force reflow

        overlay.classList.add('show');
        mist.classList.add('anim-mist');
        glow.classList.add('anim-glow');

        setTimeout(() => fsMist.classList.add('clearing'), 500);
        setTimeout(() => flash.classList.add('flash'), 3900);

        setTimeout(() => {
            showPage('divination', navBtn);
            overlay.classList.remove('show');
            setTimeout(() => { overlay.style.display = 'none'; }, 650);
            mist.classList.remove('anim-mist');
            glow.classList.remove('anim-glow');
            flash.classList.remove('flash');
            fsMist.classList.remove('active');
        }, 4200);
    }
</script>
</body>
</html>
